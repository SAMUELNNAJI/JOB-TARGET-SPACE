<!DOCTYPE html>
<!-- TEMPORARY render harness: mirrors templates/dashboard/admin/support.html +
     templates/dashboard/admin/_active_thread.html so the real chat.css /
     dashboard.css cascade can be screenshotted at phone widths. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin chat composer harness</title>
<link rel="stylesheet" href="static/css/dashboard.css">
<link rel="stylesheet" href="static/css/chat.css">
<style>body{background:#eef1f6}</style>
</head>
<body class="admin-dashboard has-chat-app-view">
<div class="dashboard-app">
  <main class="dashboard-content adm-home adm-chat-page">

    <div class="adm-chat-layout show-chat-view" id="admChatLayout">
      <div class="adm-chat-main" id="admChatMain">
        <section class="chat-panel adm-chat-panel" id="admActivePanel" data-active-thread-id="1">
          <header class="chat-head adm-chat-head">
            <button type="button" class="adm-mobile-back" data-view-target="inbox" aria-label="Back to inbox list">Inbox</button>
            <div class="chat-head-person">
              <span class="chat-inbox-avatar is-cand">9J</span>
              <div class="chat-head-info">
                <div class="chat-head-title-row">
                  <strong>9jaflavzmedia@gmail.com</strong>
                  <span class="chat-role-pill chat-role-pill--cand">Candidate</span>
                </div>
                <div class="chat-head-status">
                  <span>9jaflavzmedia@gmail.com</span>
                  <span>&bull; 08033445566</span>
                </div>
              </div>
            </div>
            <div class="chat-head-actions">
              <a class="adm-head-link" href="#"><span>Candidate Details</span></a>
              <button class="chat-action-btn" type="button" data-chat-refresh aria-label="Refresh conversation"></button>
            </div>
          </header>

          <div class="chat-quick-section adm-canned-bar">
            <div class="chat-quick-label">Canned Replies:</div>
            <div class="chat-quick-chips">
              <button type="button" class="chat-chip">Greeting</button>
              <button type="button" class="chat-chip">Under Review</button>
              <button type="button" class="chat-chip">Details Updated</button>
            </div>
          </div>

          <div class="chat-thread" id="chat-thread">
            <div class="chat-msg is-mine"><div class="chat-bubble">Hello, I would like help with my profile.</div></div>
            <div class="chat-msg"><div class="chat-bubble">Sure, happy to help.</div></div>
          </div>

          <div class="chat-recording" data-recording-bar hidden>
            <button class="chat-rec-btn chat-rec-btn--delete" type="button">x</button>
            <div class="chat-rec-center"><span>Staff Recording</span></div>
            <div class="chat-rec-actions"><button class="chat-rec-btn chat-rec-btn--send" type="button">s</button></div>
          </div>

          <form class="chat-composer" action="#" method="post" enctype="multipart/form-data">
            <input type="hidden" name="thread" value="1">
            <input type="file" name="audio" data-audio-input accept="audio/*" hidden>

            <button class="chat-mic" type="button" data-mic aria-label="Record voice reply" title="Record a voice message for member">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
              </svg>
            </button>

            <div class="chat-input-wrap">
              <textarea class="chat-input" name="body" rows="1" data-chat-input
                        placeholder="Reply to 9jaflavzmedia@gmail.… (Enter to send)"></textarea>
            </div>

            <button class="chat-send" type="submit" aria-label="Send reply" title="Send reply">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </form>
        </section>
      </div>

      <aside class="adm-chat-sidebar" id="admChatSidebar">
        <div class="adm-sidebar-card"><div class="adm-sidebar-head"><div class="adm-sidebar-head-title"><h2 class="adm-panel-title">Inbox Directory</h2></div></div></div>
      </aside>
    </div>

  </main>
</div>
<script>
if (location.search.indexOf('diag') === -1) { throw new Error('skip'); }
window.addEventListener('load', function () {
  setTimeout(function () {
    var vw = document.documentElement.clientWidth;
    var out = ['viewport=' + vw, 'doc.scrollWidth=' + document.documentElement.scrollWidth,
               'body.scrollWidth=' + document.body.scrollWidth];
    var chain = ['.dashboard-app', '.dashboard-content.adm-chat-page', '.adm-chat-layout',
                 '.adm-chat-main', '.chat-panel', '.chat-head', '.chat-head-person',
                 '.chat-head-info', '.chat-head-title-row', '.chat-head-status',
                 '.chat-head-actions', '.chat-quick-section', '.chat-quick-chips',
                 '.chat-thread', '.chat-msg', '.chat-bubble', '.chat-composer',
                 '.chat-mic', '.chat-input-wrap', '.chat-input', '.chat-send'];
    var rows = [];
    for (var c = 0; c < chain.length; c++) {
      var el = document.querySelector(chain[c]);
      if (!el) { rows.push(chain[c] + '  MISSING'); continue; }
      var s = getComputedStyle(el);
      var r = el.getBoundingClientRect();
      rows.push(pad(chain[c], 30) + ' w=' + Math.round(r.width) +
        ' client=' + el.clientWidth + ' scroll=' + el.scrollWidth +
        ' | disp=' + s.display + ' minW=' + s.minWidth + ' w=' + s.width +
        ' flex=' + s.flex + ' pos=' + s.position + ' ovf=' + s.overflowX +
        ' gtc=' + (s.gridTemplateColumns || '-'));
    }
    var wide = [];
    var all = document.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) {
      var e2 = all[i];
      var r2 = e2.getBoundingClientRect();
      if (r2.width > vw + 0.5) {
        wide.push(e2.tagName.toLowerCase() + '.' + (e2.className || '-') + ' w=' + Math.round(r2.width));
      }
    }
    var pre = document.createElement('pre');
    pre.id = 'diag';
    pre.setAttribute('style', 'position:fixed;top:0;left:0;z-index:999999;background:#fff;color:#000;font:10px/1.3 monospace;white-space:pre;padding:4px;max-width:100%;overflow:hidden;');
    pre.textContent = out.join('\n') + '\n--- CHAIN ---\n' + rows.join('\n') +
                      '\n--- WIDER THAN VIEWPORT ---\n' + wide.join('\n');
    document.body.appendChild(pre);
  }, 300);

  function pad(s, n) { while (s.length < n) { s += ' '; } return s; }
});
</script>
</body>
</html>
