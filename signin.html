<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — JobSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html"><span class="mark">◉</span><b>Job</b><i>SPACE</i></a>
    <button class="menu" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav>
      <a href="index.html">Home</a><a href="about.html">About Us</a>
      <a href="employers.html">For Employers</a><a href="candidates.html">For Candidates</a>
      <a href="how-it-works.html">How It Works</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions"><a class="outline" href="signin.html">Login</a><a class="button" href="signup.html">Sign Up</a></div>
  </header>
  <main>
    <section class="auth-wrap" style="padding:100px 10% 110px;display:flex;justify-content:center;align-items:center;min-height:70vh">
      <form class="auth-card" onsubmit="event.preventDefault();alert('Signed in! (demo)')">
        <h1>Welcome back</h1>
        <p>Sign in to your JobSpace dashboard.</p>
        <label>Email address</label>
        <input type="email" placeholder="you@example.com" required>
        <label>Password</label>
        <input type="password" placeholder="Your password" required>
        <div class="auth-row">
          <label><input type="checkbox">Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <button class="button" type="submit">Sign In　→</button>
        <div class="auth-features">
          <div class="auth-feature-pill"><span class="pill-icon">✓</span> Secure login</div>
          <div class="auth-feature-pill"><span class="pill-icon">✦</span> Human support</div>
          <div class="auth-feature-pill"><span class="pill-icon">↻</span> 24/7 access</div>
        </div>
        <p class="auth-foot">Don't have an account? <a href="signup.html">Create account</a></p>
      </form>
    </section>
  </main>
  <footer class="site-footer">© 2025 JobSpace <span>Welcome back.</span></footer>
  <script src="js/layout.js"></script>
</body>
</html>
