# ─────────────────────────────────────────────────────────────────────────────
# JobSpace — nginx site for a VPS that already serves other sites.
#
# The two sites already on this box live here:
#   /etc/nginx/conf.d/selectroyalmaids.com.ng.conf
#   /etc/nginx/conf.d/getmecare.conf
# This box has NO sites-available/sites-enabled split, so this file is simply
# dropped into /etc/nginx/conf.d/. It is a NEW file — nothing existing is
# modified.
#
# Install (as root):
#   sudo cp /var/www/jobspace/deploy/nginx/jobspace.conf /etc/nginx/conf.d/jobspace.conf
#   sudo nginx -t                       # ALWAYS test first
#   sudo systemctl reload nginx         # reload, never restart
#
# BEFORE CERTBOT: the port-80 block below serves plain HTTP so the ACME
# challenge can complete. After the certificate is issued, delete that block
# so that everything redirects to HTTPS.
# ─────────────────────────────────────────────────────────────────────────────

# Gunicorn listens on a Unix socket rather than a TCP port. A socket keeps
# traffic inside the machine and avoids the port-scan surface that an open
# 0.0.0.0:8010 would create on a box that already hosts two other sites.
upstream jobspace_app {
    server 127.0.0.1:8010 fail_timeout=0;
}

# ── HTTP (port 80) ───────────────────────────────────────────────────────────
# This block exists for the certificate challenge and for the permanent
# redirect to HTTPS. It never proxies to the app.
server {
    listen 80;
    listen [::]:80;

    # ── CHANGE THIS to your real domain ──────────────────────────────────
    server_name jobspace.example.com www.jobspace.example.com;

    # certbot writes challenge files here. Keeping this location means
    # `certbot --nginx` can renew certificates forever without downtime.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (port 443) ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # ── CHANGE THIS to your real domain ──────────────────────────────────
    server_name jobspace.example.com www.jobspace.example.com;

    # ── Paths written by `certbot --nginx -d <domain>` ────────────────────
    # Re-run that exact command if you lose these files.
    ssl_certificate     /etc/letsencrypt/live/jobspace.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobspace.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:JobSpaceSSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ────────────────────────────────────────────────
    # X-Frame-Options is left at Django's default (DENY) rather than
    # duplicated here so the two cannot drift apart.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS is deliberately NOT set here. Django already sends
    # SECURE_HSTS_SECONDS from the environment, and setting it in two places
    # would make it near-impossible to undo for a browser once it has cached
    # the header for a year.

    # ── Upload ceiling ──────────────────────────────────────────────────
    # Candidates upload CVs (PDF/DOCX) and employers upload payment-proof
    # screenshots. nginx defaults to a 1 MB limit, which rejects those.
    client_max_body_size 20M;

    access_log /var/log/nginx/jobspace.access.log;
    error_log  /var/log/nginx/jobspace.error.log;

    # ── Static assets ───────────────────────────────────────────────────
    # Served by nginx straight off disk, never touching gunicorn. The
    # filenames carry a content hash (CompressedManifestStaticFilesStorage),
    # so they can be cached for a year and still update on every deploy.
    #
    # PERMISSIONS: nginx runs as the `nginx` user. useradd created
    # /var/www/jobspace with mode 700, which means nginx cannot even TRAVERSE
    # into it and every one of these files 403s. DEPLOY.md has the two commands
    # that fix this (chmod on the path components, and adding nginx to the
    # jobspace group). Read-only serving only — nginx never writes here.
    location /static/ {
        alias /var/www/jobspace/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Uploaded files (CVs, payment proofs, voice notes) ───────────────
    # Served directly by nginx for speed. See the "uploaded files are public"
    # section of DEPLOY.md before you rely on this.
    location /media/ {
        alias /var/www/jobspace/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        # Do not let an uploaded .html or .svg render as a page under our own
        # origin. `attachment` forces a download, preventing stored XSS via
        # an uploaded file.
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Everything else goes to gunicorn ────────────────────────────────
    location / {
        proxy_pass http://jobspace_app;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Needed by the support chat's long-poll.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;

        # Payment callbacks from Flutterwave and the support chat can take a
        # while. 120s matches gunicorn's timeout so nginx does not give up
        # first and show the user a 504 mid-request.
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }
}
