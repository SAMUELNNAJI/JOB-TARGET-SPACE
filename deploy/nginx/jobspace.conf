# ─────────────────────────────────────────────────────────────────────────────
# JobSpace — nginx site for a VPS that already serves other sites.
#
# The two sites already on this box live here:
#   /etc/nginx/conf.d/selectroyalmaids.com.ng.conf
#   /etc/nginx/conf.d/getmecare.conf
# This box has NO sites-available/sites-enabled split, so this file is simply
# dropped into /etc/nginx/conf.d/. It is a NEW file — nothing existing is
# modified.
#
# Install (as root):
#   sudo cp /var/www/jobspace/deploy/nginx/jobspace.conf /etc/nginx/conf.d/jobspace.conf
#   sudo nginx -t                       # ALWAYS test first
#   sudo systemctl reload nginx         # reload, never restart
#
# BEFORE CERTBOT: the port-80 block below serves plain HTTP so the ACME
# challenge can complete. After the certificate is issued, delete that block
# so that everything redirects to HTTPS.
# ─────────────────────────────────────────────────────────────────────────────

# Gunicorn listens on a Unix socket rather than a TCP port. A socket keeps
# traffic inside the machine and avoids the port-scan surface that an open
# 0.0.0.0:8010 would create on a box that already hosts two other sites.
upstream jobspace_app {
    server 127.0.0.1:8010 fail_timeout=0;
}

# ── HTTP (port 80) ───────────────────────────────────────────────────────────
# This block exists for the certificate challenge and for the permanent
# redirect to HTTPS. It never proxies to the app.
server {
    listen 80;
    listen [::]:80;

    # ── CHANGE THIS to your real domain ──────────────────────────────────
    server_name jobspace.example.com www.jobspace.example.com;

    # certbot writes challenge files here. Keeping this location means
    # `certbot --nginx` can renew certificates forever without downtime.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    # Everything else goes to the app over plain HTTP until HTTPS exists.
    # This is deliberately NOT a 301 to https:// — there is no certificate
    # yet, so that would bounce every visitor into a connection error.
    # certbot replaces this block with a proper redirect once it issues one.
    location / {
        proxy_pass http://jobspace_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# THIS BLOCK IS COMMENTED OUT ON PURPOSE. DO NOT UNCOMMENT IT YET.
#
# It references a certificate that does not exist yet. With this block active
# but no certificate on disk, nginx refuses to start at all:
#
#   nginx: [emerg] BIO_new_file("/etc/letsencrypt/live/.../fullchain.pem") failed
#
# and because nginx is a SINGLE shared process, that takes down the other two
# sites on this box too. That is the failure this arrangement prevents.
#
# The correct order is:
#   1. Leave this commented. nginx serves plain HTTP on port 80.
#   2. Run certbot — it needs working HTTP to answer the ACME challenge:
#        certbot --nginx -d targetjobspace.com -d www.targetjobspace.com
#   3. certbot writes the certificate AND adds its own HTTPS block + redirect
#      to this file automatically. You do not need to uncomment anything.
#   4. Only if you want the hardened settings below (long cache headers,
#      upload limit, timeouts), uncomment this block, remove the duplicate
#      block certbot added, then: nginx -t && systemctl reload nginx
#
# Step 3 alone is enough to get a working HTTPS site. Everything below is a
# refinement, not a requirement.
