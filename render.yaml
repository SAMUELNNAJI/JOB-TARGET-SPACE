services:
  - type: web
    name: jobspace
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn jobspace.wsgi:application --log-file -
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      # Point this at your Neon pooled connection string.
      # sync: false keeps it OUT of git — set it once in the Render dashboard
      # under Environment, using the value from Neon → Connection Details.
      - key: DATABASE_URL
        sync: false
    # Render's filesystem is ephemeral — without a disk every uploaded CV
    # would vanish on each deploy. Mounted at MEDIA_ROOT so the saved
    # database paths keep resolving. 1 GB is enough for this workload.
    disk:
      name: jobspace-media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
